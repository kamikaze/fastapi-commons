repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Run the linter (import sorting included: "I" is selected in pyproject.toml).
      - id: ruff-check
        args: [ --fix ]
        files: ^(src|tests)/.*
        types_or: [ python, pyi ]
      # Run the formatter.
      - id: ruff-format
        files: ^(src|tests)/.*
        types_or: [ python, pyi ]

  # The type checkers need the project environment: run `uv sync --all-extras` first.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --no-sync ty check --error-on-warning src tests
        language: system
        types_or: [ python, pyi ]
        files: ^(src|tests)/.*
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright src tests
        language: system
        types_or: [ python, pyi ]
        files: ^(src|tests)/.*
        pass_filenames: false
