[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "fastapi-commons"
version = "0.13.0"
description = "Re-usable FastAPI code"
authors = [
    { name = "Oleg Korsak", email = "kamikaze.is.waiting.you@gmail.com" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE", "AUTHORS.md"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
keywords = ["fastapi", "oidc", "prometheus", "opentelemetry", "middleware"]
requires-python = ">=3.15"
dependencies = [
    "aiohttp[speedups]>=3.14.5,<4",
    "fastapi>=0.162.0,<1",
    "msgspec>=0.22.0,<1",
    "prometheus-client>=0.26.0,<1",
    "PyJWT[crypto]>=2.15.1,<3",
    "python3-commons[authn,database]>=0.30.0,<0.31",
    "SQLAlchemy[asyncio]>=2.1.8,<3",
    "starlette>=1.10.0,<2",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b2,<0.67",
    "opentelemetry-instrumentation-logging>=0.66b2,<0.67",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
    "ty",
    "types-aiobotocore-s3",
]
testing = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/kamikaze/fastapi-commons"
Documentation = "https://github.com/kamikaze/fastapi-commons/wiki"

[tool.uv]
default-groups = ["dev", "testing"]

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "MIGRATION.md", "tests/**"]


[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py315"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "TC001",
    "TC002",
    "TC003", # issues with msgspec.Struct subclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401", "DTZ", "EM101", "EM102", "PLC0415", "PLR2004", "S101", "S105", "S106", "SLF001", "TRY003"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
exclude = ["*.pyi"]
indent-style = "space"
quote-style = "single"

[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMatchNotExhaustive = "error"
reportUnnecessaryComparison = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportPrivateUsage = "error"
reportDeprecated = "error"

[[tool.pyright.executionEnvironments]]
# Tests read private state on purpose and take fixtures as parameters, so these rules apply to src only.
root = "tests"
extraPaths = [".", "src"]
reportDeprecated = false
reportPrivateUsage = false
reportMissingParameterType = false

[tool.pytest]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_debug = true
strict = true
addopts = ["--verbose"]
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["fastapi_commons"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
    "class .*\\(Protocol(\\[.*\\])?\\):",
]
fail_under = 95
