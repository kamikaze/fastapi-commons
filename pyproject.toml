[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[project]
name = "fastapi-commons"
version = "0.8.5"
description = "Re-usable FastAPI code"
authors = [
    { name = "Oleg Korsak", email = "kamikaze.is.waiting.you@gmail.com" }
]
license = "GPL-3.0"
license-files = ["LICENSE", "AUTHORS.md"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]
keywords = []
requires-python = ">=3.14.0,<3.15.0"
dependencies = [
    "aiohttp[speedups]>=3.14.3,<3.15.0",
    "asyncpg~=0.31.0",
    "fastapi~=0.141.1",
    "msgspec~=0.21.1",
    "pydantic[email]~=2.13.5",
    "pydantic-settings~=2.15.0",
    "python-jose~=3.5.0",
    "SQLAlchemy[asyncio]~=2.0.54",
    "opentelemetry-api~=1.44.0",
    "opentelemetry-sdk~=1.44.0",
    "opentelemetry-exporter-otlp~=1.44.0",
    "opentelemetry-instrumentation-fastapi~=0.65b0",
    "opentelemetry-instrumentation-logging~=0.65b0",
    "prometheus-client~=0.26.0",
    "python3-commons[authn]~=0.24.6",
    "starlette~=1.7.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
    "ty",
    "types-aiobotocore-s3",
]
testing = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/kamikaze/fastapi-commons"
Documentation = "https://github.com/kamikaze/fastapi-commons/wiki"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "tests/**"]


[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "TC001",
    "TC002",
    "TC003", # issues with msgspec.Struct subclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["DTZ", "S101"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
exclude = ["*.pyi"]
indent-style = "space"
quote-style = "single"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
reportMatchNotExhaustive = "error"
reportUnnecessaryComparison = "error"

[tool.ty.rules]
unknown-argument = "ignore"  # false positives for Pydantic model fields

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov fastapi_commons --cov-fail-under=0 --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]
